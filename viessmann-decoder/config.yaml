name: Viessmann Decoder
version: 2.3.1
slug: viessmann-decoder
description: Monitor and configure Viessmann heating systems via VBUS, KW-Bus, P300, KM-Bus, and Vitotrol emulation
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
url: https://github.com/MrTir1995/Viessmann-HA-Addon
startup: application
boot: auto
map:
  - data:rw
  - config:ro
ports:
  "8099": "8099"
ports_description:
  "8099": Web interface
ingress: true
ingress_port: 8099
ingress_panel: true
panel_icon: mdi:radiator
watchdog: http://[HOST]:8099/health
uart: true
privileged:
  - SYS_RAWIO
  - SYS_ADMIN
  - SYS_PTRACE
  - DAC_READ_SEARCH
full_access: true
host_network: false
host_dbus: false
hassio_api: true
hassio_role: default
stage: stable
image: docker.io/mrtir071/viessmann-decoder-{arch}
options:
  serial_port: /dev/ttyUSB0
  baud_rate: 1200
  protocol: km_remote
  serial_config: 8E1
  remote_model: vitotrol300
  remote_slot: 1
  invert_serial: false
  log_level: info
  usbip_enable: false
  usbip_host: ""
  usbip_busid: ""
  usbip_port: 3240
schema:
  serial_port: str
  baud_rate: list(1200|2400|4800|9600|19200|38400|57600|115200)
  protocol: list(vbus|kw|p300|km|km_remote)
  serial_config: list(8N1|8E1|8E2)
  remote_model: list(vitotrol200|vitotrol300)
  remote_slot: list(1|2|3)
  invert_serial: bool?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  usbip_enable: bool
  usbip_host: str?
  usbip_busid: str?
  usbip_port: port?
